// Decals have their own scale slider, so stop Tweakscale from rescaling them

@PART[*]:HAS[@MODULE[ModuleConformalDecal]]:NEEDS[TweakScale]
{
  %tweakscale_ignore = true
}

@PART[*]:HAS[@MODULE[ModuleConformalFlag]]:NEEDS[TweakScale]
{
  %tweakscale_ignore = true
}

@PART[*]:HAS[@MODULE[ModuleConformalText]]:NEEDS[TweakScale]
{
  %tweakscale_ignore = true
}
