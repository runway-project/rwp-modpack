            subchange = A modified copy of Text Mesh Pro version 2.1.6 is now bundled with Conformal Decals.
            subchange = List of included fonts:
            subchange = Noto Sans
            subchange = Noto Sans CJK
            subchange = Nimbus Sans, a replacement for Liberation Sans and Helvetica
            subchange = Gyrotrope, a Eurostile clone and replacement for Waukegan Extended
            subchange = Carlito, a replacement for Calibri
            subchange = League Spartan, a Futura clone
            subchange = Neuropol
            subchange = AmarilloUSAF
            subchange = All fonts now support their entire character set, instead of only the glyphs that were rendered ahead of time.
        }

        CHANGE {
            type = Removed
            change = Removed Nasalization, Helvetica, and Waukegan fonts due to licensing incompatibility
            subchange = Note: Calibri and Liberation Sans were never bundled with Conformal Decals, but made available from the base game. The update to TextMeshPro makes this no longer possible, so they are no longer available without installing them yourself.
            subchange = If you would like to use Nasalization again, download it from [Typodermic Fonts](https://typodermicfonts.com/downloads/) (in the "free fonts" zip file) and add it to GameData
        }

